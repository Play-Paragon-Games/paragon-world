<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Paragon World · Board</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{
  --bg:#ecebe6;--board:#f8f7f3;--card:#ffffff;--ink:#1c1b19;--muted:#6b6862;--line:#d9d6ce;--edge:#bdb9ae;
  --info:#3b6fd6;--good:#1f9d55;--warn:#d98b0b;--bad:#d7342c;--gray:#a3a09a;
  --info-bg:#e9f0fc;--good-bg:#e6f6ec;--warn-bg:#fdf1dc;--bad-bg:#fbe5e3;--gray-bg:#efeeeb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f100e;--board:#191a17;--card:#20211d;--ink:#ecebe7;--muted:#9a978f;--line:#30312c;--edge:#45463f;
  --info:#7aa2f7;--good:#4cc27a;--warn:#f2b544;--bad:#f06a60;--gray:#6e6c67;
  --info-bg:#1c2538;--good-bg:#162b1f;--warn-bg:#33270f;--bad-bg:#3a1a18;--gray-bg:#24241f;
}}
:root[data-theme="dark"]{
  --bg:#0f100e;--board:#191a17;--card:#20211d;--ink:#ecebe7;--muted:#9a978f;--line:#30312c;--edge:#45463f;
  --info:#7aa2f7;--good:#4cc27a;--warn:#f2b544;--bad:#f06a60;--gray:#6e6c67;
  --info-bg:#1c2538;--good-bg:#162b1f;--warn-bg:#33270f;--bad-bg:#3a1a18;--gray-bg:#24241f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
main{max-width:1320px;margin:0 auto;padding:12px 20px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:6px 0 12px}
h1{font-size:18px;margin:0;letter-spacing:.01em}
h1 span{color:var(--muted);font-weight:500}
.top-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
.top-right a{color:var(--muted)}
.live{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block}
.dot.on{background:var(--good)}
.dot.err{background:var(--bad)}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 12px;display:none}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- Layout ---------- */
.table{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}

/* ---------- Board ---------- */
.board{background:var(--board);border:2px solid var(--edge);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.track-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mid{display:grid;grid-template-columns:104px minmax(0,1fr) 104px;gap:8px}
.space{position:relative;border:1.5px solid var(--edge);border-radius:10px;background:var(--card);min-height:86px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.space .n{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.space .nm{font-size:12px;font-weight:600;line-height:1.2}
.space .dir{position:absolute;right:7px;top:5px;font-size:12px;color:var(--edge)}
.space .pawns{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.space.has{border-color:var(--ink)}
.space.side{min-height:0}
.pawn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--muted);line-height:1.1;text-align:center}
.pawn svg{width:38px;height:38px;display:block}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:10px 10px 8px;min-height:128px;display:flex;flex-direction:column;gap:4px;cursor:pointer;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--gray)}
.tile.info::before{background:var(--info)}.tile.good::before{background:var(--good)}.tile.warn::before{background:var(--warn)}.tile.bad::before{background:var(--bad)}
.tile.info{background:var(--info-bg)}.tile.good{background:var(--good-bg)}.tile.warn{background:var(--warn-bg)}.tile.bad{background:var(--bad-bg)}.tile.gray{background:var(--gray-bg)}
.tile:hover,.tile:focus-visible{border-color:var(--ink);outline:none}
.tile .nm{font-weight:650;font-size:13px;margin-top:4px}
.tile .tx{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.tile.gray .nm{color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:999px;background:var(--gray-bg);color:var(--muted);border:1px solid var(--line)}
.tag.info{color:var(--info);border-color:var(--info)}.tag.good{color:var(--good);border-color:var(--good)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}

.tokens{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-height:14px}
.tok{width:12px;height:12px;border-radius:50%;background:var(--info);border:1.5px solid var(--card)}
.tok.amazon{background:var(--warn)}
.tok.upgrade{background:transparent;border-color:var(--info)}
.tok.drop{animation:drop .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}60%{opacity:1}100%{transform:none}}
.tokens .more{font-size:11px;color:var(--muted)}

.meeples{display:flex;gap:6px;align-items:flex-end}
.meeple{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);line-height:1.1}
.meeple svg{width:30px;height:38px;display:block}
.meeple .body{fill:var(--gray)}
.meeple.info .body{fill:var(--info)}.meeple.good .body{fill:var(--good)}.meeple.warn .body{fill:var(--warn)}.meeple.bad .body{fill:var(--bad)}
.meeple .flag{fill:var(--bad)}.meeple .pole{stroke:var(--ink);stroke-width:1.2}

/* ---------- Mats ---------- */
.mats{display:flex;flex-direction:column;gap:12px}
.mat{border-radius:14px;padding:14px 16px}
.mat .hd{display:flex;gap:12px;align-items:center}
.mat .hd svg{width:46px;height:46px;flex:0 0 auto;background:#f3ecdc;border-radius:50%;padding:6px}
.mat .ttl{font-size:16px;font-weight:700;line-height:1.15}
.mat .stg{font-size:12px;opacity:.85;margin-top:2px}
.mat .rows{margin-top:10px;font-size:13px}
.mat .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.16)}
.mat .r b{font-variant-numeric:tabular-nums}
.mat .big{font-size:40px;font-weight:700;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.mat .of{font-size:13px;opacity:.85;margin-top:2px}
.mat .upd{font-size:11px;opacity:.7;margin-top:8px}
.mat.status{background:#4a1626;color:#f3e7cf;border:1px solid #c9a45c;box-shadow:inset 0 0 0 4px #4a1626,inset 0 0 0 5px #c9a45c;font-family:Georgia,"Times New Roman",serif}
.mat.status .ttl{letter-spacing:.02em}
.mat.status .big{color:#e8c77c}
.runbar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin-top:10px;border:1px solid #c9a45c;gap:2px;background:#4a1626}
.runbar i{display:block;height:100%}
.runbar .ks{background:#c9a45c}.runbar .pre{background:#e8d5a8}.runbar .left{background:#7b2f44}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.mat.cata{background:#2b2a27;color:#e6dcc6;border:1px solid #6f685a;font-family:Georgia,"Times New Roman",serif}
.mat.cata .r{border-top-color:rgba(230,220,198,.18)}
.mat.tnt{background:#1f4a3a;color:#f0e6c8;border:1px solid #c7a548;padding:10px 14px}
.mat.tnt .hd svg{width:36px;height:36px}
.mat.tnt .ttl{font-size:14px}

/* ---------- Your move ---------- */
.hand-wrap{margin-top:20px;overflow-x:clip}
.hand-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.hand-hd .ct{font-size:22px;font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* ---------- Detail panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:10}
.scrim.open{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);border-left:1px solid var(--edge);padding:18px 20px 28px;overflow:auto;z-index:11;display:none}
.panel.open{display:block}
.panel .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:6px}
.panel h2{font-size:20px;margin:0 28px 6px 0}
.panel .ln{font-size:15px;margin:10px 0 4px;overflow-wrap:anywhere}
.panel .sub{color:var(--muted);font-size:13px}
.panel .kv{margin-top:8px;font-size:13px}
.panel .kv div{padding:4px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.panel .kv div span:last-child{text-align:right}
.panel h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 4px}
.ev{padding:7px 0;border-top:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:10px 1fr;gap:8px}
.ev .sw{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--gray)}
.ev .sw.info{background:var(--info)}.ev .sw.good{background:var(--good)}.ev .sw.warn{background:var(--warn)}.ev .sw.bad{background:var(--bad)}
.ev .m{color:var(--muted);font-size:11px}
.ev .x2{overflow-wrap:anywhere}

/* ---------- View toggle and 3D mode ---------- */
.viewtoggle{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.viewtoggle button{border:0;background:none;padding:4px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.soundbtn{border:1px solid var(--edge);border-radius:8px;background:none;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.soundbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
#stage3d,.hint3d{display:none}
.note3d{display:none;font-size:13px;color:var(--muted);margin:0 0 10px}
body.v3d main{max-width:none;padding:8px 12px 0}
body.v3d header{padding:4px 4px 8px}
body.v3d #view{position:relative;height:calc(100vh - 56px);min-height:540px;border-radius:14px;overflow:hidden;overflow:clip;border:1px solid var(--line)}
body.v3d #stage3d{display:block;position:absolute;inset:0}
body.v3d .hint3d{display:block;position:absolute;left:14px;top:10px;font-size:12px;color:var(--muted);pointer-events:none}
body.v3d .board{display:none}
body.v3d .table{display:block;position:absolute;top:12px;right:12px;width:292px;max-height:calc(100% - 184px);overflow:auto;pointer-events:none}
body.v3d .mats{flex-direction:column;gap:8px;pointer-events:auto}
body.v3d .mats .mat{flex:none;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
body.v3d .mat .hd svg{width:36px;height:36px;padding:4px}
body.v3d .mat .ttl{font-size:14px}
body.v3d .mat .big{font-size:30px;margin-top:8px}
body.v3d .mat .rows{margin-top:6px;font-size:12px}
body.v3d .mat .upd{margin-top:5px}
body.v3d .hand-hd{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 12px;margin-bottom:6px}
body.v3d .hand-hd .ct{font-size:18px}
[data-pick]{cursor:pointer}
body.v3d #view{background:#221a14;border-color:#3a2a1e}
body.v3d .hint3d{color:#cdbfae}
body.v3d .hand{height:176px}
body.v3d .pcard{bottom:-62px}
body.v3d .pcard:hover,body.v3d .pcard:focus-visible,body.v3d .pcard.flipped{transform:translateX(var(--x,0px)) translateY(-78px) rotate(0deg) scale(1.06)}
body.v3d .discard{bottom:8px;height:120px;width:86px}
body.v3d .hand-wrap{position:absolute;left:12px;right:316px;bottom:0;margin:0;pointer-events:none}

/* ---------- Your move: a fanned hand of cards ---------- */
.hand{position:relative;height:232px;perspective:1300px}
.pcard{position:absolute;left:calc(50% - 60px);bottom:8px;width:150px;height:208px;margin-left:-75px;transform-origin:50% 130%;transform:translateX(var(--x,0px)) translateY(var(--y,0px)) rotate(var(--r,0deg));transition:transform .18s ease;cursor:pointer;pointer-events:auto;outline:none;--pc:#8f8a80}
.pcard:hover,.pcard:focus-visible,.pcard.flipped{transform:translateX(var(--x,0px)) translateY(-18px) rotate(0deg) scale(1.06);z-index:60 !important}
.pcard.warn{--pc:#c97a06}.pcard.bad{--pc:#cf3329}
.pc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s ease}
.pcard.flipped .pc-in{transform:rotateY(180deg)}
.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:#fbf5e6;color:#231a12;border:1px solid #cbb994;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:11px 11px 10px;display:flex;flex-direction:column;overflow:hidden}
.pc-face::after{content:"";position:absolute;inset:5px;border:1.5px solid var(--pc);border-radius:8px;pointer-events:none}
.pc-back{transform:rotateY(180deg);background:#f5edd9}
.pcard.pile .pc-front{box-shadow:3px -3px 0 -1px #f1e8d2,3px -3px 0 0 #cbb994,6px -6px 0 -1px #eadfc6,6px -6px 0 0 #cbb994,0 3px 10px rgba(0,0,0,.3)}
.pc-corner{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--pc)}
.pc-corner svg{width:15px;height:15px;flex:0 0 auto}
.pc-sym{display:flex;justify-content:center;margin:9px 0 7px;color:var(--pc)}
.pc-sym svg{width:56px;height:56px}
.pc-title{font-weight:750;font-size:15px;line-height:1.15;text-align:center}
.pc-text{font-size:11.5px;line-height:1.3;color:#5d5144;text-align:center;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc-count{position:absolute;right:12px;top:11px;background:var(--pc);color:#fff;border-radius:999px;font-weight:800;font-size:13px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 6px}
.pc-back .pc-title{text-align:left;font-size:14px;margin-top:6px}
.pc-detail{font-size:11.5px;line-height:1.32;color:#4c4136;margin-top:5px;overflow:auto;overflow-wrap:anywhere;flex:1 1 auto;min-height:0}
.pc-detail .mt{color:#85786a;margin-top:4px}
.pc-row{display:flex;justify-content:space-between;gap:6px;width:100%;border:0;border-top:1px solid #dccfb2;background:none;padding:4px 6px 4px 3px;font-size:11.5px;color:#231a12;text-align:left;cursor:pointer;box-sizing:border-box}
.pc-row span:last-child{color:#85786a;white-space:nowrap}
.pc-row:hover{background:#ece2c8}
.pc-open{margin-top:6px;border:1px solid #bda97f;background:#fffaf0;border-radius:7px;padding:4px 8px;font-size:11.5px;font-weight:650;color:#231a12;cursor:pointer;position:relative;z-index:1}
.pc-open:hover{background:#fff}
.discard{position:absolute;right:6px;bottom:14px;width:100px;height:139px;border:2px dashed rgba(150,135,110,.7);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-align:center;pointer-events:none}
.discard b{font-size:24px;line-height:1}
.discard.has{border:1px solid #1e150f;background:repeating-linear-gradient(45deg,#5a1a2e 0 8px,#6b2238 8px 16px);color:#f3e7cf;box-shadow:2px -2px 0 #3d1220,0 3px 10px rgba(0,0,0,.3)}
body.v3d .discard{color:#cdbfae}
@media (prefers-reduced-motion: reduce){.pcard,.pc-in{transition:none}}

@media (max-width:1040px){.table{grid-template-columns:1fr}.mats{flex-direction:row;flex-wrap:wrap}.mats .mat{flex:1 1 280px}}
@media (max-width:680px){main{padding:10px 12px 32px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.mid{grid-template-columns:64px minmax(0,1fr) 64px}.space{padding:5px}.space .nm{font-size:10px}.pawn svg{width:28px;height:28px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Paragon World <span>· Board</span></h1>
    <div class="top-right">
      <div class="viewtoggle" role="group" aria-label="Board view"><button id="v-3d" aria-pressed="false">3D</button><button id="v-flat" aria-pressed="true">Flat</button></div>
      <button id="sound" class="soundbtn" aria-pressed="false" title="A soft chime when an order arrives">Sound off</button>
      <a id="plainlink" href="index.html">Plain page</a>
      <div class="live"><span class="dot" id="dot"></span><span id="livetxt">connecting</span></div>
    </div>
  </header>
  <div class="err" id="err"></div>

  <div class="note3d" id="note3d"></div>
  <div id="view">
  <div id="stage3d"></div>
  <div class="hint3d">Drag to rotate · scroll to zoom · click a building or piece</div>
  <div class="table">
    <div class="board" id="board" aria-label="Board">
      <div class="track-row" id="track-top"></div>
      <div class="mid">
        <div class="track-col" id="track-left" style="display:flex"></div>
        <div class="tiles" id="tiles"></div>
        <div class="track-col" id="track-right" style="display:flex"></div>
      </div>
      <div class="track-row" id="track-bottom"></div>
    </div>
    <aside class="mats" id="mats" aria-label="Title mats"></aside>
  </div>

  <section class="hand-wrap" aria-label="Your move">
    <div class="hand-hd"><span class="label">Your move</span><span class="ct" id="hand-n">–</span></div>
    <div class="hand" id="hand"><div class="discard" id="discard">Discard</div></div>
  </section>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="Details"><button class="x" id="panel-x" aria-label="Close">×</button><div id="panel-body"></div></aside>

<script src="world.js"></script>
<script>
(() => {
"use strict";
const {LA, STAGES, STAGE_ORDER, CHANNELS, $, esc, money, ago} = World;
const n0 = (v) => Number(v).toLocaleString("en-US");

// ---------- Simple drawn pieces (session 1: placeholders, polish later) ----------
const PAWN = {
  // Status: a top hat.
  "status": `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="33" rx="15" ry="4" fill="#4a1626"/><rect x="11" y="9" width="18" height="23" rx="2" fill="#4a1626"/><rect x="11" y="25" width="18" height="4" fill="#c9a45c"/><ellipse cx="20" cy="9" rx="9" ry="2.5" fill="#6b2438"/></svg>`,
  // Catacombes de Paris: a cart carrying bones.
  "catacombes-de-paris": `<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#e6dcc6" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="15" x2="22" y2="9"/><line x1="14" y1="9" x2="27" y2="15"/><line x1="18" y1="16" x2="30" y2="11"/></g><g fill="#e6dcc6"><circle cx="10" cy="15" r="2.2"/><circle cx="22" cy="9" r="2.2"/><circle cx="14" cy="9" r="2.2"/><circle cx="27" cy="15" r="2.2"/><circle cx="30" cy="11" r="2.2"/></g><path d="M5 17h30l-3 11H8z" fill="#2b2a27" stroke="#6f685a" stroke-width="1.5"/><line x1="35" y1="18" x2="39" y2="13" stroke="#2b2a27" stroke-width="2.5" stroke-linecap="round"/><circle cx="14" cy="31" r="5.5" fill="#6f685a" stroke="#2b2a27" stroke-width="2"/><circle cx="14" cy="31" r="1.5" fill="#2b2a27"/><circle cx="27" cy="31" r="5.5" fill="#6f685a" stroke="#2b2a27" stroke-width="2"/><circle cx="27" cy="31" r="1.5" fill="#2b2a27"/></svg>`,
  // Trade and Triumph: a merchant's coin token.

const handEls = new Map(); let handItems = null, handOrder = [], flippedKey = null, discardN = 0;

  const n = handOrder.length, room = $("hand").clientWidth - 150 - 120, gap = Math.min(132, Math.max(54, room / Math.max(1, n - 1)));
  handOrder.forEach((key, i) => { const el = handEls.get(key), o = i - (n - 1) / 2; el.style.setProperty("--x", (o * gap).toFixed(1) + "px"); el.style.setProperty("--r", (o * 4).toFixed(1) + "deg"); el.style.setProperty("--y", (o * o * 3).toFixed(1) + "px"); el.style.zIndex = 10 + i; });

// A card whose reason is gone flies to the discard pile. The pile counts what was resolved since the page opened.
function flyToDiscard(src){

  return `<h2>${esc(a.name)}</h2><div><span class="tag ${a.level === "gray" ? "" : a.level}">${esc(state)}</span></div><div class="ln">${esc(a.text)}</div>
    ${kvRows([["Task", a.task && esc(a.task)], ["Needs", !a.silent && a.needs ? esc(a.needs) : ""], [a.state === "working" ? "Working in" : "District", at ? esc(at.name) : ""], ["Last status", a.age === null ? "" : ago(a.age) + (a.silent ? " · silent after 24 hours" : "")]])}
    ${recent(s.events.filter(x => x.entity === "agent:" + a.slug).slice(0, 12), s.now, "This agent has never sent a status.")}`;
}
function runHtml(s){
  const r = s.statusRun;
  return `<h2>Status run 1</h2><div class="sub">Printing at Sky Game. Each box on the table is 100 copies still unspoken for.</div>${r ? kvRows(runRows(r)) : `<div class="empty">No base-game total from the world function yet.</div>`}`;
}
function stageHtml(slug, s){
  const i = STAGE_ORDER.indexOf(slug), here = s.titles.filter(t => t.stageSlug === slug);
  return `<h2>${i + 1}. ${esc(STAGES[slug])}</h2><div class="sub">Space ${i + 1} of 10 on the title track.</div>
    ${here.length ? kvRows(here.map(t => [esc(t.name), "here since " + ago(t.age)])) : `<div class="empty" style="margin-top:10px">No title on this space.</div>`}`;
}
function detailHtml(kind, id, s){
  if (kind === "district"){ const d = s.districts.find(x => x.slug === id); return d ? panelHtml(d, s) : null; }
  if (kind === "title"){ const t = s.titles.find(x => x.slug === id); return t ? titleHtml(t, s) : null; }
  if (kind === "agent"){ const a = s.agents.find(x => x.slug === id); return a ? agentHtml(a, s) : null; }
  if (kind === "run") return runHtml(s);
  if (kind === "stage") return STAGE_ORDER.includes(id) ? stageHtml(id, s) : null;
  return null;
}
function openPanel(kind, id){
  if (!last) return;
  const html = detailHtml(kind, id, last); if (!html) return;
  open = {kind, id};
  $("panel-body").innerHTML = html;
  $("panel").classList.add("open"); $("scrim").classList.add("open");
}
function closePanel(){ open = null; $("panel").classList.remove("open"); $("scrim").classList.remove("open"); }
document.addEventListener("click", (ev) => {
  const p = ev.target.closest("[data-pick]");
  if (p) { const [kind, id] = p.dataset.pick.split(":"); openPanel(kind, id); return; }
  const card = ev.target.closest(".pcard[data-key]");
  if (card) { flipCard(card); return; }
  const t = ev.target.closest("[data-place]");
  if (t) { openPanel("district", t.dataset.place); return; }
  if (ev.target.id === "scrim" || ev.target.id === "panel-x") closePanel();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") closePanel();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches(".pcard[data-key]")) { ev.preventDefault(); flipCard(ev.target); }
});

// ---------- View mode: 3D (three.js, loaded only when used) or flat ----------
const pref = { get(){ try { return localStorage.getItem("pw-view"); } catch (_) { return null; } }, set(v){ try { localStorage.setItem("pw-view", v); } catch (_) {} } };
let mode = "flat", scene3d = null, loading3d = false;
function fitInset(){
  if (!scene3d) return;
  const st = $("stage3d").getBoundingClientRect(), mats = $("mats").getBoundingClientRect(), hand = document.querySelector(".hand-wrap").getBoundingClientRect();
  scene3d.setInset(Math.max(0, st.right - mats.left), Math.max(0, st.bottom - hand.top - 50)); // the cards may overlap the table edge, not the board
}
function showMode(){
  document.body.classList.toggle("v3d", mode === "3d");
  $("v-3d").setAttribute("aria-pressed", String(mode === "3d")); $("v-flat").setAttribute("aria-pressed", String(mode === "flat"));
  layoutHand();
}
async function setMode(m, save){
  if (save) pref.set(m);
  if (m === "flat"){
    mode = "flat"; showMode();
    if (scene3d) { scene3d.dispose(); scene3d = null; }
    return;
  }
  if (scene3d || loading3d) return;
  mode = "3d"; showMode(); loading3d = true; $("note3d").style.display = "none";
  try {
    const { createBoard3D } = await import("./board3d.js");
    if (mode !== "3d") return; // switched back while loading
    scene3d = createBoard3D($("stage3d"), World, openPanel);
    if (last) { scene3d.update(last); fitInset(); }
  } catch (e) {
    // No WebGL, or the 3D code failed to load: the flat board is the same data.
    if (scene3d) { try { scene3d.dispose(); } catch (_) {} scene3d = null; }
    mode = "flat"; showMode();
    $("note3d").textContent = "The 3D board could not start in this browser, so this is the flat board."; $("note3d").style.display = "block";
  } finally { loading3d = false; }
}
$("v-3d").addEventListener("click", () => setMode("3d", true));
$("v-flat").addEventListener("click", () => setMode("flat", true));
window.addEventListener("resize", () => { fitInset(); layoutHand(); });
$("view").addEventListener("scroll", () => { $("view").scrollTop = 0; $("view").scrollLeft = 0; }); // focusing a card must never scroll the scene
window.__board = { scene: () => scene3d, mode: () => mode, discard: () => discardN, sound: () => ({ on: sound.on, played: sound.played, state: sound.ctx ? sound.ctx.state : null }) };

// ---------- Sound: a soft chime per new order. Off unless switched on. ----------
const sound = { on: false, ctx: null, played: 0 };
try { sound.on = localStorage.getItem("pw-sound") === "on"; } catch (_) {}
function showSound(){ $("sound").setAttribute("aria-pressed", String(sound.on)); $("sound").textContent = sound.on ? "Sound on" : "Sound off"; }
function audio(){ // browsers only allow sound after a click, so the context is made (or woken) on one
  if (!sound.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) sound.ctx = new AC(); }
  if (sound.ctx && sound.ctx.state === "suspended") sound.ctx.resume();
  return sound.ctx;
}
function chime(delay){
  const ctx = sound.ctx; if (!sound.on || !ctx || ctx.state !== "running") return;
  const t = ctx.currentTime + delay, g = ctx.createGain(); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  for (const [f, v] of [[1046.5, 1], [1568, 0.45]]) { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = "sine"; o.frequency.value = f; og.gain.value = v; o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.95); }
  sound.played++;
}
$("sound").addEventListener("click", () => { sound.on = !sound.on; try { localStorage.setItem("pw-sound", sound.on ? "on" : "off"); } catch (_) {} showSound(); if (sound.on) { audio(); chime(0.05); } });
document.addEventListener("pointerdown", () => { if (sound.on) audio(); }, { passive: true });
showSound();
const heardOrders = new Set(); let heardFirst = true;
function chimeNewOrders(s){
  let fresh = 0;
  for (const o of s.todayOrders) if (!heardOrders.has(o.id)) { heardOrders.add(o.id); if (!heardFirst && fresh < 6) chime(0.18 * fresh++ + 0.45); }
  heardFirst = false;
}

// ---------- Render ----------
function render(s){
  last = s;
  renderTrack(s); renderTiles(s); renderMats(s); renderHand(s); chimeNewOrders(s);
  if (open) { const sc = $("panel").scrollTop; openPanel(open.kind, open.id); $("panel").scrollTop = sc; }
  if (scene3d) { scene3d.update(s); fitInset(); }
  firstRender = false;
  $("plainlink").href = "index.html#k=" + encodeURIComponent(World.key());
}
setMode(pref.get() || (window.innerWidth >= 900 ? "3d" : "flat"), false);
World.start(render);
})();
</script>
